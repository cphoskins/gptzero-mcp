[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gptzero-mcp"
version = "0.1.0"
description = "MCP server for GPTZero AI content detection — sentence-level and paragraph-level scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Paul Hoskins", email = "paul@proactioncto.com" },
]
keywords = ["mcp", "gptzero", "ai-detection", "content-detection", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/cphoskins/gptzero-mcp"
Repository = "https://github.com/cphoskins/gptzero-mcp"
Issues = "https://github.com/cphoskins/gptzero-mcp/issues"

[project.scripts]
gptzero-mcp = "gptzero_mcp.server:main"
